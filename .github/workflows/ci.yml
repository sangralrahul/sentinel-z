name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo

  s390x:
    # Builds and tests the container for IBM Z (s390x) under QEMU emulation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/s390x --load -t sentinel-z:s390x .
      - run: docker run --rm --platform linux/s390x sentinel-z:s390x node cli/sentinel-z.js analyze data/sample-events.csv --train-days 14
